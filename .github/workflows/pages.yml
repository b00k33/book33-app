name: Deploy to GitHub Pages

# 2026-08-06: the repo's old "legacy" (branch-based, Jekyll) Pages build started
# failing on every push ("Page build failed", no further detail) regardless of what
# changed -- confirmed it wasn't a Jekyll-processing issue (adding .nojekyll didn't
# help), which points at GitHub's older Pages build pipeline itself being retired
# rather than anything in this repo. Switches deployment to the newer Actions-based
# pipeline: this workflow builds an artifact from the repo root (same "/" path the
# old source used, so nothing about what's served changes) and deploys it to Pages
# directly, bypassing the broken legacy builder entirely.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 2026-08-06: the first two Actions-based deploys both got stuck at
          # deployment_queued/in_progress on GitHub's own Pages backend for the
          # full default 10-minute timeout and were cancelled -- no error, no
          # incident on githubstatus.com, just slower than default for this repo/
          # environment. Doubling it gives GitHub's side room to actually finish
          # rather than getting cut off mid-deploy every single time.
          timeout: 1200000
