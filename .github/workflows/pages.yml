name: Deploy to GitHub Pages

# 2026-08-06: the repo's old "legacy" (branch-based, Jekyll) Pages build started
# failing on every push ("Page build failed", no further detail) regardless of what
# changed -- confirmed it wasn't a Jekyll-processing issue (adding .nojekyll didn't
# help), which points at GitHub's older Pages build pipeline itself being retired
# rather than anything in this repo. Switches deployment to the newer Actions-based
# pipeline: this workflow builds an artifact from just the files the app actually
# serves and deploys it to Pages directly, bypassing the broken legacy builder.
#
# Deploy speed/reliability notes (2026-08-06 pt.2, Linh: "how to improve deploy
# time"): the first three Actions-based attempts all stalled at deployment_queued
# on GitHub's own Pages backend for the full 10-minute timeout (deploy-pages@v4
# hard-caps its own timeout input at 600000ms regardless of what's set here, so
# raising it does nothing -- confirmed by trying 1200000 and watching it get
# clamped back down with a warning). That stall is on GitHub's side for this repo/
# environment, not something workflow config fixes. What IS a real improvement:
# cancel-in-progress below, so several sessions pushing to main in quick succession
# don't each queue a full deploy attempt behind a slow/stuck one -- only the newest
# commit's deploy matters, so cancelling stale in-flight ones is strictly better.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage only what the app actually serves
        # supabase/ (deploy scripts + SQL schema), .github/, and the repo's own
        # planning docs (ABOUT-ME.md, CLAUDE.md) were never meant to be public --
        # this list mirrors sw.js's own SHELL precache array, plus sw.js itself.
        # nanjing.html is only a redirect stub now (2026-09-02): the Nanjing app
        # moved to its own repo/site, b00k33/c5-nanjing -- the stub keeps any
        # home-screen icon or bookmark that was added while it briefly lived at
        # this path from dying as a 404. Anything not on THIS list is silently
        # dropped from the deploy (confirmed the hard way, 2026-09-01). Smaller
        # artifact, and stops publishing files that don't belong on the live site.
        run: |
          mkdir _site
          cp index.html sw.js manifest.json apple-touch-icon.png favicon-32.png icon-192.png icon-512.png nanjing.html _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
