<html lang="en">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600&display=swap">

<style>
/* ============ design44 tokens ============
   Ink & Brass — this standalone app's own signature palette (Linh's exact spec,
   2026-08-31), independent of index.html's app-shell tokens since this file has no
   dependency on it. Structural rules (type/spacing/radius/heights/flat-no-boxes) still
   follow design44. Night only — no light theme for this app. */
:root{
  --bg:#0f0b07;
  --surface:#17120d;
  --raised:#1b140d;
  --line:rgba(216,185,121,.14);
  --text:#efe7d6;
  --muted:#9c8f79;
  --faint:#5f5645;
  --brass:#d8b979;
  --gold:#efd9a6;
  --jade:#37AF65;
  --clay:#d63a3a;
  --nav-bg:#0c0906;

  /* R10 — three type sizes, nothing else, except numeral/glyph display (sized to its
     own tile, not this scale — the countdown number, driver's big Chinese address). */
  --fs-title:20px;
  --fs-body:13px;
  --fs-meta:11px;

  /* R11 — radius follows shape: row(rectangular,filled)=10, circle=999, card/standalone
     button=14, cell(small tile)=6. */
  --r-row:10px;
  --r-card:14px;
  --r-cell:6px;
  --r-circle:999px;

  /* Line-spacing law — three line-heights, nothing else. */
  --lh-tight:1.1;
  --lh-snug:1.25;
  --lh-read:1.4;

  --pad:16px;
  --tabh:60px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:var(--fs-body);
  line-height:var(--lh-snug);
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));
}
.zh{font-family:"Noto Serif SC","Songti SC","PingFang SC",serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- header (page-header law: <=56px, one row, no eyebrow/display title) ---------- */
header{
  position:sticky;top:0;z-index:30;
  background:var(--bg);
  padding:12px var(--pad);
  display:flex;align-items:center;gap:8px;
}
header .back{
  border:0;background:none;color:var(--muted);
  font:500 var(--fs-meta)/1 "IBM Plex Sans",sans-serif;letter-spacing:.07em;text-transform:uppercase;
  padding:8px 4px 8px 0;cursor:pointer;text-decoration:none;flex:0 0 auto;
}
header .back:hover{color:var(--brass)}
header .badge{
  font:700 var(--fs-meta)/1 "IBM Plex Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;
  color:var(--brass);background:var(--raised);border-radius:var(--r-cell);padding:4px 8px;flex:0 0 auto;
}
header h1{
  font-family:"Noto Serif SC",serif;
  font-weight:600;font-size:var(--fs-title);margin:0;letter-spacing:.01em;
  flex:1;min-width:0;
}
#saveBtn{
  border:0;background:transparent;color:var(--faint);
  font:600 var(--fs-meta)/1 "IBM Plex Sans",sans-serif;letter-spacing:.06em;text-transform:uppercase;
  padding:8px 12px;border-radius:var(--r-cell);cursor:default;flex:0 0 auto;
}
#saveBtn.dirty{background:var(--brass);color:#0f0b07;cursor:pointer}
#saveBtn.busy{color:var(--gold)}

/* ---------- layout ---------- */
main{padding:0 0 24px}
.sect{padding:16px var(--pad) 4px}
.sect + .sect{padding-top:16px}
.eyebrow{
  font-size:var(--fs-meta);letter-spacing:.07em;text-transform:uppercase;color:var(--brass);
  margin:0 0 8px;font-weight:700;line-height:var(--lh-tight);
}
.band{background:var(--surface);padding:16px var(--pad);margin-top:8px}
.band.tight{padding:12px var(--pad)}
.row{display:flex;gap:12px;align-items:baseline}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.muted{color:var(--muted)}
.small{font-size:var(--fs-meta)}

/* ---------- editable fields ---------- */
.f{display:flex;flex-direction:column;gap:1px;padding:8px 0}
.f .lbl{font-size:var(--fs-meta);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);line-height:var(--lh-tight)}
.f .v{
  font-size:var(--fs-body);color:var(--text);outline:none;min-height:20px;
  border-bottom:1px solid transparent;padding:1px 0;word-break:break-word;line-height:var(--lh-snug);
}
.f .v:focus{border-bottom-color:var(--brass)}
.f .v:empty::before{content:attr(data-ph);color:var(--faint)}
/* .big carries emphasis by WEIGHT only (R16: one signal per row, never size+weight
   together) — stays on the body type step, not its own size. */
.f.big .v{font-weight:600}
/* .zhv is the one deliberate exception to the 3-size rule: Chinese text here is read
   aloud to a taxi driver or copied verbatim onto a form — legibility is functional, not
   decorative, so it gets numeral/glyph-display treatment (R10's 5th role) rather than
   the body-text size. */
.f.zhv .v{font-family:"Noto Serif SC",serif;font-size:16px}
.di{
  background:transparent;border:0;border-bottom:1px solid transparent;
  color:var(--text);font:400 var(--fs-body)/1.4 "IBM Plex Mono",monospace;
  padding:2px 0;width:100%;outline:none;
}
.di:focus{border-bottom-color:var(--brass)}
.di::-webkit-calendar-picker-indicator{filter:invert(.65) sepia(1) saturate(2) hue-rotate(5deg);cursor:pointer}

/* ---------- lists / cards ---------- */
.card{background:var(--surface);padding:16px var(--pad);margin-top:8px;position:relative}
.card .kill{
  position:absolute;top:8px;right:8px;background:none;border:0;color:var(--faint);
  font-size:15px;line-height:1;padding:4px 8px;cursor:pointer;
}
.card .kill:hover{color:var(--clay)}
.addbtn{
  margin:12px var(--pad) 0;background:none;border:0;color:var(--brass);
  font:600 var(--fs-body)/1 "IBM Plex Sans",sans-serif;padding:8px 0;cursor:pointer;letter-spacing:.02em;
}
.addbtn:hover{color:var(--gold)}

/* ---------- today ---------- */
.count{padding:24px var(--pad) 16px;background:var(--surface)}
.count .n{font-family:"Noto Serif SC",serif;font-size:44px;line-height:var(--lh-tight);color:var(--gold);font-weight:600}
.count .n .u{font-family:"IBM Plex Sans",sans-serif;font-size:var(--fs-body);color:var(--muted);font-weight:400;margin-left:8px;letter-spacing:.02em}
.count .sub{color:var(--muted);font-size:var(--fs-body);margin-top:8px;line-height:var(--lh-snug)}

/* Rows inside a list: separated by TONE, never a hairline border (design44 R4 names
   "a hairline under every row" as the classic failure of "flat, separate by colour and
   space"). Compact 34px band (R11) — dense, phone, list context. */
.item{display:flex;gap:12px;padding:8px 0;align-items:flex-start}
.item .t{color:var(--gold);font-size:var(--fs-body);min-width:52px;padding-top:2px}
.item .w{flex:1;outline:none;min-height:20px}
.item .w:empty::before,.item .t:empty::before,.chk .w:empty::before{content:attr(data-ph);color:var(--faint)}
.item.done .w{color:var(--faint);text-decoration:line-through}
.item .tick{
  width:18px;height:18px;border:1px solid var(--line);border-radius:var(--r-circle);
  background:none;flex:0 0 auto;margin-top:2px;cursor:pointer;padding:0;
}
.item.done .tick{background:var(--jade);border-color:var(--jade)}
.item .x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:14px;padding:0 2px}

.dayrow{
  display:flex;align-items:center;gap:12px;
  padding:12px var(--pad);
}
.dayrow .dl{font-size:var(--fs-meta);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);flex:1}
.dayrow .dadd{background:none;border:0;color:var(--brass);font-size:19px;line-height:1;cursor:pointer;padding:2px 6px}
.dayrow .dadd:hover{color:var(--gold)}
.daynote .v{display:block;outline:none;min-height:20px;color:var(--text);font-size:var(--fs-body);line-height:var(--lh-read)}
.daynote .v:empty::before{content:attr(data-ph);color:var(--faint)}
.daynote.spaced{margin-top:12px;padding-top:12px}

/* ---------- check list ---------- */
.chk{display:flex;gap:12px;align-items:center;padding:8px 0}
.chk .tick{width:17px;height:17px;border:1px solid var(--line);border-radius:var(--r-cell);background:none;cursor:pointer;flex:0 0 auto;padding:0}
.chk.done .tick{background:var(--jade);border-color:var(--jade)}
.chk .w{flex:1;outline:none}
.chk.done .w{color:var(--faint);text-decoration:line-through}
.chk .x{background:none;border:0;color:var(--faint);cursor:pointer;padding:0 4px}

/* ---------- secret ---------- */
.secret .v{-webkit-text-security:disc;text-security:disc}
.revealed .v{-webkit-text-security:none;text-security:none}
.reveal{
  background:var(--raised);border:0;color:var(--brass);
  font:700 var(--fs-meta)/1 "IBM Plex Sans",sans-serif;letter-spacing:.07em;text-transform:uppercase;
  padding:8px 12px;border-radius:var(--r-cell);cursor:pointer;
}
.reveal:hover{color:var(--gold)}

/* ---------- photos ---------- */
.pics{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.pics img{
  width:74px;height:74px;object-fit:cover;border-radius:var(--r-cell);cursor:pointer;
  background:var(--raised);display:block;
}
.picadd,.picpaste{
  width:74px;height:74px;border:0;border-radius:var(--r-cell);background:var(--raised);
  color:var(--brass);font-size:var(--fs-meta);line-height:1.3;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;
}
.picadd:hover,.picpaste:hover{color:var(--gold)}
.picadd .plus,.picpaste .clip{font-size:18px;line-height:1}
.pichint{font-size:var(--fs-meta);color:var(--faint);margin-top:8px;line-height:var(--lh-read)}
#photo{position:fixed;inset:0;z-index:70;background:#0b0805;display:none;flex-direction:column}
#photo.on{display:flex}
#photo .frame{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:12px}
#photo img{max-width:100%;max-height:100%;border-radius:var(--r-row)}
#photo .bar{display:flex;gap:8px;align-items:center;padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom,0px))}
#photo .cap{
  flex:1;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);
  font:400 var(--fs-body) "IBM Plex Sans",sans-serif;padding:6px 0;outline:none;
}
#photo .cap:focus{border-bottom-color:var(--brass)}
#photo button{
  background:var(--raised);border:0;color:var(--text);border-radius:var(--r-card);
  padding:12px 16px;font:600 var(--fs-body) "IBM Plex Sans",sans-serif;cursor:pointer;
}
#photo button.del{color:#fff;background:var(--clay)}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));
  background:var(--raised);color:var(--text);
  padding:8px 16px;border-radius:var(--r-circle);font-size:var(--fs-body);z-index:50;display:none;max-width:88vw;text-align:center;
}
#toast.on{display:block}

/* ---------- driver card ---------- */
.bigbtn{
  display:block;width:calc(100% - 32px);margin:16px var(--pad) 0;
  background:var(--brass);color:#0f0b07;border:0;border-radius:var(--r-card);
  font:600 var(--fs-body)/1 "IBM Plex Sans",sans-serif;padding:16px;cursor:pointer;
}
#driver{
  position:fixed;inset:0;z-index:60;background:#0b0805;display:none;
  padding:24px var(--pad);overflow:auto;
}
#driver.on{display:block}
#driver .lead{color:var(--brass);font-size:var(--fs-meta);letter-spacing:.07em;text-transform:uppercase}
#driver .zhbig{font-family:"Noto Serif SC",serif;font-size:30px;line-height:1.4;margin:16px 0;color:#fff}
#driver .en{color:var(--muted);font-size:var(--fs-body);line-height:var(--lh-read)}
#driver .close{
  margin-top:24px;background:var(--raised);border:0;color:var(--text);
  padding:12px 16px;border-radius:var(--r-card);font:600 var(--fs-body) "IBM Plex Sans",sans-serif;cursor:pointer;
}

/* ---------- guide ---------- */
.g .band h3{font-size:var(--fs-body);margin:16px 0 8px;font-weight:600;color:var(--text)}
.g .band p{margin:8px 0;color:var(--text);font-size:var(--fs-body);line-height:var(--lh-read)}
.g .band ul{margin:8px 0;padding-left:18px;color:var(--text);font-size:var(--fs-body);line-height:var(--lh-read)}
.g .band li{margin:4px 0}
.g .band a{color:var(--gold)}
.phrase{display:flex;flex-direction:column;gap:1px;padding:8px 0}
.phrase .cn{font-family:"Noto Serif SC",serif;font-size:18px;color:#fff;line-height:var(--lh-tight)}
.phrase .py{font-size:var(--fs-meta);color:var(--brass)}
.phrase .en{font-size:var(--fs-body);color:var(--muted)}

/* ---------- tabs ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--nav-bg);
  /* the fixed shell's own top edge, not a list-row hairline — the one border in this
     file, separating persistent chrome from scrollable content. */
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav button{
  background:none;border:0;color:var(--faint);cursor:pointer;
  height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font:600 var(--fs-meta)/1 "IBM Plex Sans",sans-serif;letter-spacing:.07em;text-transform:uppercase;
}
nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5}
nav button[aria-selected="true"]{color:var(--gold)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
footer{padding:24px var(--pad) 8px;color:var(--faint);font-size:var(--fs-meta);line-height:var(--lh-read)}
footer button{background:none;border:0;color:var(--brass);font:inherit;cursor:pointer;padding:0;text-decoration:underline}

@media (min-width:820px){
  :root{--pad:28px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;align-items:start}
  /* R2: pages stay full-bleed (header/nav span the viewport); form/reading content
     inside the page caps at --content-max and centres, so fields don't stretch the
     full desktop width. */
  main{max-width:720px;margin:0 auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">‹ BK33</a>
  <span class="badge">C5</span>
  <h1>Nanjing</h1>
  <button id="saveBtn">Saved</button>
</header>

<main id="view"></main>

<nav id="tabs">
  <button data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Today</button>
  <button data-tab="travel" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 13l8-2 3-7 2 1-1 6 6-1.5 1 2-6 2 1 6-2 1-3-6-8 2z"/></svg>Travel</button>
  <button data-tab="docs" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h7M9 16h7"/></svg>Docs</button>
  <button data-tab="plan" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="1"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plan</button>
  <button data-tab="guide" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 4h9a3 3 0 013 3v13H8a3 3 0 00-3 3z"/><path d="M8 8h6M8 12h6"/></svg>Guide</button>
</nav>

<input type="file" id="picker" accept="image/*" multiple hidden>
<input type="file" id="restorer" accept="application/json,.json" hidden>
<div id="toast" role="status"></div>

<div id="photo" role="dialog" aria-label="Photo">
  <div class="frame"><img id="phImg" alt=""></div>
  <div class="bar">
    <input class="cap" id="phCap" placeholder="Label this photo — e.g. outbound boarding pass">
    <button class="del" id="phDel">Delete</button>
    <button id="phClose">Close</button>
  </div>
</div>

<div id="driver" role="dialog" aria-label="Address for the driver">
  <div class="lead">Please take me here</div>
  <div class="zhbig" id="drvZh"></div>
  <div class="en" id="drvEn"></div>
  <button class="close" id="drvClose">Close</button>
</div>

<script>
(function(){
"use strict";

/* ============ state ============ */
var DEFAULT = {
  v: 1,
  trip: { start:"", end:"", why:"" },
  flights: [
    { dir:"Outbound", date:"", airline:"", no:"", from:"", to:"NKG Nanjing Lukou", dep:"", arr:"", term:"", ref:"", seat:"" },
    { dir:"Return", date:"", airline:"", no:"", from:"NKG Nanjing Lukou", to:"", dep:"", arr:"", term:"", ref:"", seat:"" }
  ],
  stay: { name:"", nameZh:"", addr:"", addrZh:"", checkin:"", checkout:"", ref:"", phone:"", room:"" },
  transfers: [],
  docs: {
    passport:"", passExpiry:"", visa:"", entry:"",
    insurer:"", policy:"", insPhone:"",
    emergency:[ {who:"", phone:""} ],
    host:"", hostPhone:""
  },
  days: {},
  checklist: [
    {t:"Passport valid 6+ months", d:false},
    {t:"Alipay set up + card verified", d:false},
    {t:"Travel insurance bought", d:false},
    {t:"eSIM / roaming sorted", d:false},
    {t:"VPN installed (before you land)", d:false},
    {t:"Hotel address saved in Chinese", d:false},
    {t:"Meds + English scripts packed", d:false},
    {t:"Type A / I plug adapter", d:false},
    {t:"Small gifts for hosts", d:false},
    {t:"Clinic notebook + pens", d:false}
  ]
};

var DB = null;
function idbOpen(){
  return new Promise(function(res, rej){
    if(DB) return res(DB);
    var r = indexedDB.open('book33-nanjing', 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
    r.onsuccess = function(){ DB = r.result; res(DB); };
    r.onerror = function(){ rej(r.error); };
  });
}
function idbGet(){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var q = db.transaction('kv','readonly').objectStore('kv').get('state');
      q.onsuccess = function(){ res(q.result || null); };
      q.onerror = function(){ rej(q.error); };
    });
  });
}
function idbPut(v){
  return idbOpen().then(function(db){
    return new Promise(function(res, rej){
      var q = db.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(v)), 'state');
      q.onsuccess = function(){ res(); };
      q.onerror = function(){ rej(q.error); };
    });
  });
}
function merge(base, saved){
  if(!saved) return base;
  var out = JSON.parse(JSON.stringify(base));
  Object.keys(saved).forEach(function(k){ out[k] = saved[k]; });
  return out;
}

var S = merge(DEFAULT, null);

/* ============ helpers ============ */
function h(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function get(path){
  var p = path.split('.'), o = S;
  for(var i=0;i<p.length;i++){ if(o==null) return ''; o = o[p[i]]; }
  return o==null ? '' : o;
}
function set(path, val){
  var p = path.split('.'), o = S;
  for(var i=0;i<p.length-1;i++){ o = o[p[i]]; }
  o[p[p.length-1]] = val;
}
function field(path, label, ph, cls){
  return '<label class="f ' + (cls||'') + '"><span class="lbl">' + h(label) + '</span>' +
         '<span class="v" contenteditable="true" data-path="' + h(path) + '" data-ph="' + h(ph||'') + '">' +
         h(get(path)) + '</span></label>';
}
function dfield(path, label, re){
  return '<label class="f"><span class="lbl">' + h(label) + '</span>' +
         '<input type="date" class="di" data-path="' + h(path) + '"' + (re ? ' data-re="1"' : '') +
         ' value="' + h(get(path)) + '"></label>';
}
function parseD(s){
  if(!s) return null;
  var m = String(s).trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  var d = new Date(s);
  return isNaN(d) ? null : d;
}
function iso(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function pretty(d){
  return d.toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'});
}
function today(){ var n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }

}

function shrink(file, cb){
  if(!file || !/^image\//.test(file.type)) return cb(null);
  var url = URL.createObjectURL(file), img = new Image();
  img.onload = function(){
    var max = 1600, s = Math.min(1, max / Math.max(img.width, img.height));
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * s));
    c.height = Math.max(1, Math.round(img.height * s));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    var out = null;
    try{ out = c.toDataURL('image/jpeg', 0.72); }catch(e){}
    URL.revokeObjectURL(url);
    cb(out);
  };
  img.onerror = function(){ URL.revokeObjectURL(url); cb(null); };
  img.src = url;
}
function addPics(files, ctx){
  var list = Array.prototype.slice.call(files).filter(function(f){ return /^image\//.test(f.type); });
  if(!list.length) return;
  var left = list.length, added = 0;
  list.forEach(function(f){
    shrink(f, function(data){
      if(data){ ctxPics(ctx).push({ id:uid(), d:data, cap:'' }); added++; }
      if(--left === 0){
        if(added){
          markDirty();
          render();
          toast(added + (added===1?' photo':' photos') + ' added to ' + ctxName(ctx) + ' — tap Save to keep it');
          sizeWarn();
        } else {
          toast('That image could not be read');
        }
      }
    });
  });
}
function totalBytes(){
  try{ return JSON.stringify(S).length; }catch(e){ return 0; }
}
function sizeWarn(){
  var mb = totalBytes() / 1048576;
  if(mb > 9) toast('Getting full (' + mb.toFixed(1) + ' MB of about 14). Delete a photo or two.');
}
function picsHtml(ctx, label){

    }).join('') +
    '<button class="picadd" data-act="picadd" data-ctx="' + h(ctx) + '">' +
    '<span class="plus">+</span>' + h(label || 'Photo') + '</button>' +

    '<span class="clip">⎘</span>Paste</button></div>';
}
function pasteFromClipboard(ctx){
  if(!navigator.clipboard || !navigator.clipboard.read){
    toast('Paste isn’t supported in this browser — use the + tile instead.');
    return;
  }
  navigator.clipboard.read().then(function(items){
    var gets = [];
    items.forEach(function(item){
      item.types.forEach(function(type){
        if(/^image\//.test(type)){
          gets.push(item.getType(type).then(function(blob){
            return new File([blob], 'clipboard.' + (type.split('/')[1] || 'jpg'), { type: type });
          }));
        }
      });
    });
    if(!gets.length){ toast('No image on the clipboard — copy a photo first.'); return; }
    Promise.all(gets).then(function(files){ addPics(files, ctx); });
  }).catch(function(){
    toast('Couldn’t read the clipboard — allow paste access, or use the + tile.');
  });
}

document.addEventListener('paste', function(ev){
  var dt = ev.clipboardData;
  if(!dt) return;
  var files = [];
  for(var i=0;i<dt.items.length;i++){
    if(dt.items[i].kind === 'file'){
      var f = dt.items[i].getAsFile();
      if(f && /^image\//.test(f.type)) files.push(f);
    }
  }
  if(!files.length) return;
  ev.preventDefault();
  addPics(files, activeCtx);
});

['dragover','drop'].forEach(function(t){

});

   ['谢谢','Xièxie','Thank you'],
   ['请带我去这个地址','Qǐng dài wǒ qù zhège dìzhǐ','Please take me to this address'],
   ['我来学习中医','Wǒ lái xuéxí zhōngyī','I am here to study Chinese medicine'],
   ['我可以拍照吗？','Wǒ kěyǐ pāizhào ma?','May I take a photo?'],
   ['这个是什么药材？','Zhège shì shénme yàocái?','What herb is this?'],
   ['中药房在哪里？','Zhōngyào fáng zài nǎlǐ?','Where is the herbal pharmacy?'],
   ['多少钱？','Duōshao qián?','How much is it?'],
   ['我可以用支付宝吗？','Wǒ kěyǐ yòng Zhīfùbǎo ma?','Can I pay with Alipay?'],
   ['洗手间在哪里？','Xǐshǒujiān zài nǎlǐ?','Where is the toilet?'],
   ['请慢一点','Qǐng màn yìdiǎn','Please speak more slowly'],
   ['请帮我','Qǐng bāng wǒ','Please help me']
  ].map(function(p){
    return '<div class="phrase"><span class="cn">' + p[0] + '</span><span class="py">' + p[1] + '</span><span class="en">' + p[2] + '</span></div>';
  }).join('') + '</div></div>' +

  '<footer>Everything you type or paste is saved on this device as you go — nothing leaves your phone. ' +
  'Storing about ' + (totalBytes()/1048576).toFixed(1) + ' MB. ' +
  '<button data-act="backup">Download a backup</button> · ' +
  '<button data-act="restore">Restore from a backup</button></footer>';
}

function render(toTop){
  var y = window.scrollY;
  if(tab === 'today') vToday();
  else if(tab === 'travel') vTravel();
  else if(tab === 'docs') vDocs();
  else if(tab === 'plan') vPlan();
  else vGuide();
  window.scrollTo(0, toTop ? 0 : y);
}

/* ============ events ============ */
document.getElementById('tabs').addEventListener('click', function(ev){
  var b = ev.target.closest('button[data-tab]');
  if(!b) return;
  tab = b.dataset.tab;
  Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){
    x.setAttribute('aria-selected', x === b ? 'true' : 'false');
  });
  render(true);
});

view.addEventListener('input', function(ev){
  var el = ev.target.closest('[data-path]');
  if(!el) return;
  var val = (el.tagName === 'INPUT') ? el.value : el.textContent.replace(/\s+$/,'');
  set(el.dataset.path, val);
  markDirty();
});

view.addEventListener('change', function(ev){
  var el = ev.target.closest('[data-re]');
  if(!el) return;
  set(el.dataset.path, el.value);
  markDirty();
  render();
});

view.addEventListener('click', function(ev){
  var scope = ev.target.closest('[data-ctx]');
  if(scope) activeCtx = scope.dataset.ctx;
  var b = ev.target.closest('[data-act]');
  if(!b) return;
  var a = b.dataset.act, i = +b.dataset.i, key = b.dataset.key;

  if(a === 'chk'){ S.checklist[i].d = !S.checklist[i].d; markDirty(); render(); }
  else if(a === 'chkadd'){ S.checklist.push({t:'', d:false}); markDirty(); render(); }
  else if(a === 'chkdel'){ S.checklist.splice(i,1); markDirty(); render(); }
  else if(a === 'flightadd'){ S.flights.push({dir:'',date:'',airline:'',no:'',from:'',to:'',dep:'',arr:'',term:'',ref:'',seat:''}); markDirty(); render(); }
  else if(a === 'flightdel'){ S.flights.splice(i,1); markDirty(); render(); }
  else if(a === 'tradd'){ S.transfers.push({when:'',what:'',note:''}); markDirty(); render(); }
  else if(a === 'trdel'){ S.transfers.splice(i,1); markDirty(); render(); }
  else if(a === 'emadd'){ S.docs.emergency.push({who:'',phone:''}); markDirty(); render(); }
  else if(a === 'emdel'){ S.docs.emergency.splice(i,1); markDirty(); render(); }
  else if(a === 'itemadd'){ dayRec(key).items.push({time:'',what:'',d:false}); markDirty(); render(); }
  else if(a === 'itemdel'){ dayRec(key).items.splice(i,1); markDirty(); render(); }
  else if(a === 'itemtick'){ var it = dayRec(key).items[i]; it.d = !it.d; markDirty(); render(); }
  else if(a === 'reveal'){
    var box = document.getElementById('secretBox');
    var on = box.classList.toggle('revealed');
    b.textContent = on ? 'Hide numbers' : 'Show numbers';
  }
  else if(a === 'picadd'){ pendingCtx = b.dataset.ctx; activeCtx = pendingCtx; picker.click(); }
  else if(a === 'pastebtn'){ activeCtx = b.dataset.ctx; pasteFromClipboard(b.dataset.ctx); }
  else if(a === 'picopen'){ showPic(b.dataset.ctx, b.dataset.id); }
  else if(a === 'driver'){ openDriver(); }
  else if(a === 'backup'){ backup(); }
  else if(a === 'restore'){ restorer.click(); }
});

/* keep Enter from making a mess inside single-line fields */
view.addEventListener('keydown', function(ev){
  if(ev.key !== 'Enter') return;
  var el = ev.target.closest && ev.target.closest('[data-path]');
  if(el && !/\.note$/.test(el.dataset.path)){
    ev.preventDefault();
    el.blur();
  }
});

function openDriver(){
  document.getElementById('drvZh').textContent = S.stay.addrZh || S.stay.nameZh || 'Add your hotel address in Chinese on the Travel page';
  document.getElementById('drvEn').textContent = [S.stay.name, S.stay.addr, S.stay.phone].filter(Boolean).join(' · ');
  document.getElementById('driver').classList.add('on');
}
document.getElementById('drvClose').addEventListener('click', function(){
  document.getElementById('driver').classList.remove('on');
});

idbGet().then(function(o){
  if(o) S = merge(DEFAULT, o);
  render(true);
  saidSaved('Saved');
}).catch(function(){
  render(true);
  saidSaved('Saved');
});
})();
</script>

</body>
</html>
