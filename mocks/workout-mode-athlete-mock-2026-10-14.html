<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workout Mode, athlete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* ===== tokens: the app's Day theme + the gym-visuals hues already live in the templates editor ===== */
:root {
  --ground: #F5F7FA; --paper: #FFFFFF; --line: #E6E9EF; --ink: #1E2330; --soft: #6B7280; --faint: #9AA3B2;
  --accent: #2F5BEA; --fit: #3E9E5B; --fit-ink: #2B7A43;
  --ac-core: #E39B2E; --ac-legs: #2A9D8F; --ac-push: #E0634E; --ac-pull: #3F6FD8; --ac-full: #7C5CBF;
  --mbase: #DDE2EA; --mline: #B7BFCC; --tint: #EEF2F7; --tint2: #E4E9F1;
  --r-md: 16px; --r-sm: 10px; --shadow: 0 12px 34px rgba(20, 30, 50, .10);
  --lh-tight: 1.1; --lh-snug: 1.25; --lh-read: 1.4;
}
:root[data-theme="dark"] {
  --ground: #0E1116; --paper: #171B22; --line: #262C36; --ink: #ECEFF4; --soft: #9AA3B2; --faint: #6B7280;
  --fit: #4DB56D; --fit-ink: #7BD094;
  --mbase: #2A313C; --mline: #3B4452; --tint: #1F252E; --tint2: #262D38; --shadow: 0 12px 34px rgba(0, 0, 0, .45);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font: 500 14px/var(--lh-snug) Manrope, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; padding: 16px 16px 48px; }
button, input, output { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
b { font-weight: 700; }
small { font-size: 12px; color: var(--soft); }
.lab { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }

/* ===== mock chrome (not part of the app) ===== */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; max-width: 980px; margin: 0 auto 16px; }
.bar h1 { font-size: 14px; font-weight: 800; margin: 0; letter-spacing: .01em; }
.bar .hint { color: var(--soft); font-size: 12px; margin-left: auto; }
.seg { display: inline-flex; position: relative; background: var(--tint); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { position: relative; z-index: 1; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--soft); transition: color .2s; min-height: 32px; }
.seg button.on { color: var(--ink); }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 4px); border-radius: 999px; background: var(--paper); box-shadow: 0 1px 4px rgba(0,0,0,.12); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.seg[data-v="1"] .thumb { transform: translateX(calc(100% + 2px)); }

/* ===== the frame: computer = a sheet; phone = a 390px phone ===== */
.frame { max-width: 980px; margin: 0 auto; container: mock / inline-size; }
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); max-height: 86vh; overflow: auto; display: flex; flex-direction: column; }
.frame.phone { max-width: 390px; }
.frame.phone .sheet { height: 780px; max-height: none; border-radius: 34px; border: 10px solid #15181E; }
.frame.phone .sheet .head { padding-top: 24px; }

/* ===== Workout Mode header (unchanged from today's screen) ===== */
.head { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 12px 16px; background: color-mix(in oklab, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.head .back { justify-self: start; color: var(--accent); font-weight: 700; min-height: 32px; padding: 0 4px; }
.head .ttl { display: flex; align-items: baseline; gap: 8px; }
.head .type { font-weight: 800; font-size: 16px; }
.head .status { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--soft); font-size: 13px; padding: 2px 8px; border-radius: 999px; background: var(--tint); }
.head .status.live { color: var(--fit-ink); background: color-mix(in oklab, var(--fit) 16%, transparent); }
.head .x { justify-self: end; width: 32px; height: 32px; border-radius: 999px; background: var(--tint); font-size: 18px; line-height: 1; color: var(--soft); }
.body { padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 12px; }

/* ===== week strip: the same 7 dots, now with the day letter under each ===== */
.week { display: flex; gap: 4px; padding: 0 4px; }
.wd { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; justify-content: center; border-radius: var(--r-sm); }
.wd i { display: block; width: 12px; height: 12px; border-radius: 999px; border: 2px solid var(--mline); background: transparent; transition: background .4s, border-color .4s, transform .3s; }
.wd.done i { background: var(--fit); border-color: var(--fit); }
.wd.planned i { border-style: dashed; border-color: var(--fit); }
.wd.rest i { border-color: var(--line); background: var(--tint); }
.wd small { font-size: 11px; font-weight: 700; color: var(--faint); }
.wd.today { background: var(--tint); }
.wd.today small { color: var(--ink); }
.wd.today i { transform: scale(1.15); }

/* ===== the athlete strip: body map + ring + numbers + legend ===== */
.hero { position: relative; display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 16px; padding: 12px 16px; border-radius: var(--r-md); background: var(--tint); }
.map { display: flex; gap: 4px; align-items: flex-end; }
.map .fig { height: 118px; width: auto; }
.ring { position: relative; width: 72px; height: 72px; }
.ring svg { width: 72px; height: 72px; transform: rotate(-90deg); }
.ring .tr { fill: none; stroke: var(--tint2); stroke-width: 6; }
.ring .pr { fill: none; stroke: var(--fit); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 163.4; stroke-dashoffset: 163.4; transition: stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1); }
.ring .rin { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.ring .rin b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ring .rin small { font-size: 10px; margin-top: 2px; }
.hstats { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hnums { display: flex; gap: 16px; flex-wrap: wrap; }
.hn { display: flex; flex-direction: column; line-height: 1; }
.hn b { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.hn small { font-size: 11px; margin-top: 3px; }
.leg { display: flex; gap: 6px; flex-wrap: wrap; }
.leg button { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-size: 12px; font-weight: 700; color: var(--soft); min-height: 28px; transition: border-color .2s, color .2s; }
.leg button::before { content: ""; width: 8px; height: 8px; border-radius: 999px; background: var(--c); }
.leg button.on { border-color: var(--c); color: var(--ink); }
.leg button b { color: var(--ink); }
.trophy { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--r-sm); background: var(--paper); border: 1px solid var(--line); animation: arrive .5s cubic-bezier(.2,.8,.2,1) both; }
.trophy .eq { animation: trophyPop .6s cubic-bezier(.2,.8,.2,1) both; }
.trophy b { font-size: 15px; }
.trophy small { margin-left: auto; font-variant-numeric: tabular-nums; }

/* ===== the one big control: Begin (plan) → Start rest / the rest banner (live) ===== */
.begin { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 52px; border-radius: var(--r-md); background: var(--fit); color: #fff; font-size: 16px; font-weight: 800; letter-spacing: .01em; animation: beginPulse 2.4s ease-in-out infinite; transition: transform .15s; }
.begin:active { transform: scale(.985); }
.reststart { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 44px; border-radius: var(--r-md); border: 1px dashed color-mix(in oklab, var(--ink) 22%, transparent); color: var(--soft); font-weight: 700; }
.rest { position: sticky; top: 56px; z-index: 4; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: var(--r-md); background: color-mix(in oklab, var(--fit) 14%, var(--paper)); border: 1px solid color-mix(in oklab, var(--fit) 45%, transparent); animation: arrive .35s cubic-bezier(.2,.8,.2,1) both; }
.rring { position: relative; width: 44px; height: 44px; flex: none; }
.rring svg { width: 44px; height: 44px; transform: rotate(-90deg); }
.rring .tr { fill: none; stroke: color-mix(in oklab, var(--fit) 22%, transparent); stroke-width: 3.5; }
.rring .pr { fill: none; stroke: var(--fit); stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 94.25; transition: stroke-dashoffset 1s linear; }
.rring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--fit-ink); }
.rtxt { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.2; }
.rtxt b { font-size: 14px; }
.rtxt small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rchip { padding: 8px 12px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-weight: 700; font-size: 13px; min-height: 36px; }

/* ===== exercise cards ===== */
.cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.card { --ac: var(--ac-full); position: relative; border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--paper); animation: arrive .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--k, 0) * 70ms); transition: opacity .3s, border-color .3s, box-shadow .3s; }
.card.active { border-color: color-mix(in oklab, var(--fit) 55%, transparent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--fit) 12%, transparent); }
.card.alldone { opacity: .78; }
.card.dim { opacity: .35; }
.chead { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 10px; }
.gl { display: grid; place-items: center; width: 48px; height: 48px; border-radius: var(--r-sm); background: color-mix(in oklab, var(--ac) 14%, var(--paper)); border: 1px solid color-mix(in oklab, var(--ac) 30%, transparent); transition: background .4s; }
.card.alldone .gl { background: color-mix(in oklab, var(--fit) 18%, var(--paper)); border-color: color-mix(in oklab, var(--fit) 45%, transparent); }
.cttl { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.cttl b { font-size: 15px; line-height: var(--lh-tight); }
.cttl small { display: inline-flex; align-items: center; gap: 6px; }
.csum, .cdone { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--soft); font-size: 13px; white-space: nowrap; }
.cdone.all { color: var(--fit-ink); }
.cx { width: 32px; height: 32px; border-radius: 999px; color: var(--faint); font-size: 18px; line-height: 1; }
.cx:hover { background: var(--tint); color: var(--ink); }
.ctrls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 12px; font-weight: 700; color: var(--soft); min-height: 32px; transition: border-color .2s, background .2s, color .2s; }
.chip.on { border-color: var(--accent); color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, var(--paper)); }
.chip.add { border-style: dashed; }
.chip i { font-style: normal; font-size: 11px; padding: 1px 5px; border-radius: 999px; background: var(--accent); color: #fff; }
.tiny { font-size: 12px; font-weight: 700; color: var(--soft); padding: 6px 8px; min-height: 32px; }
.ctrl { display: inline-flex; align-items: center; gap: 6px; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); overflow: hidden; }
.step button { width: 32px; height: 32px; display: grid; place-items: center; font-size: 16px; color: var(--soft); }
.step button:hover { background: var(--tint); color: var(--ink); }
.step output { min-width: 44px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 14px; display: inline-block; }
.step output::after { content: attr(data-u); font-size: 10px; font-weight: 700; color: var(--faint); margin-left: 3px; }
.demoEdit { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.demoEdit input, .pnote, .addrow input { flex: 1; min-width: 160px; min-height: 36px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 13px; }
.ribrow { display: flex; align-items: center; gap: 10px; }
.rib { flex: 1; display: flex; gap: 2px; height: 8px; }
.rib .st { flex: var(--g) 1 0; border-radius: 999px; background: color-mix(in oklab, var(--ac) 55%, var(--paper)); transition: background .4s, flex .3s; }
.rib .st.done { background: var(--fit); }
.rib .rs { flex: var(--g) 1 0; height: 2px; align-self: center; border-radius: 999px; background: var(--line); }
.ribT { font-size: 12px; font-weight: 700; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }

.sets { display: flex; flex-direction: column; gap: 4px; }
.setR { position: relative; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 8px 4px 4px; border-radius: var(--r-sm); background: var(--paper); overflow: hidden; transition: box-shadow .3s; }
.setR::before { content: ""; position: absolute; inset: 0; width: var(--p, 0%); border-radius: inherit; background: color-mix(in oklab, var(--ac) 14%, transparent); transition: width .55s cubic-bezier(.2,.8,.2,1), background .4s; }
.setR.done::before { width: 100%; background: color-mix(in oklab, var(--fit) 18%, transparent); }
.setR > * { position: relative; }
.setR .n { width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: var(--soft); background: var(--tint); flex: none; transition: background .3s, color .3s; }
.setR button.n { border: 2px solid color-mix(in oklab, var(--ink) 18%, transparent); background: var(--paper); }
.setR button.n:hover { border-color: var(--fit); color: var(--fit-ink); }
.setR .n.done { background: var(--fit); border-color: var(--fit); color: #fff; animation: tickPop .4s cubic-bezier(.2,.8,.2,1); }
.setR.next { box-shadow: 0 0 0 2px color-mix(in oklab, var(--fit) 55%, transparent); animation: nextGlow 1.8s ease-in-out infinite; }
.setR.next button.n { border-color: var(--fit); color: var(--fit-ink); }
.setR .x { margin-left: auto; width: 32px; height: 32px; border-radius: 999px; color: var(--faint); font-size: 16px; }
.setR .x:hover { background: var(--tint); color: var(--ink); }
.setR.addset { justify-content: center; min-height: 40px; border: 1px dashed color-mix(in oklab, var(--ink) 18%, transparent); color: var(--soft); font-weight: 700; font-size: 13px; cursor: pointer; }
.setR.addset::before { display: none; }
.hold { display: inline-grid; place-items: center; min-width: 44px; height: 36px; padding: 0 10px; border-radius: 999px; background: var(--fit); color: #fff; font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
.hold.on { background: var(--paper); color: var(--fit-ink); border: 2px solid var(--fit); animation: holdBreath 1s ease-in-out infinite; }
.coach { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--soft); }
.coach .cs { display: inline-flex; align-items: center; gap: 6px; }
.coach .cs b { color: var(--ink); }
.coach .cg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.coach .up { color: var(--fit-ink); font-weight: 700; }

/* ===== add exercise + pain notes ===== */
.addrow { display: flex; flex-direction: column; gap: 8px; }
.often { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pain { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--line); }
.pchips { display: flex; gap: 6px; flex-wrap: wrap; }
.pnote { flex: none; width: 100%; }

/* ===== gym art (same drawing as the templates editor) ===== */
/* the drawn parts live in <defs>, so their selectors must not be scoped under .fig (a <use> clone matches the original's own position) */
.base { fill: var(--mbase); stroke: var(--mline); stroke-width: .6; }
.mus { fill: currentColor; }
.shd { fill: url(#shade); }
.fib { fill: none; stroke: #000; stroke-width: .55; stroke-linecap: round; opacity: .16; }
.fig use.m { color: var(--mbase); opacity: .14; transition: opacity .6s ease; }
/* week dots: .rest is also the rest banner's class — the dot states win on specificity */
.wd.rest { position: static; padding: 0; gap: 4px; background: none; border: 0; border-radius: var(--r-sm); animation: none; }
.wd.rest.today { background: var(--tint); }
.fig use.a-core { color: var(--ac-core); opacity: var(--i-core, .14); }
.fig use.a-legs { color: var(--ac-legs); opacity: var(--i-legs, .14); }
.fig use.a-push { color: var(--ac-push); opacity: var(--i-push, .14); }
.fig use.a-pull { color: var(--ac-pull); opacity: var(--i-pull, .14); }
.map.hl use.m { opacity: .08; }
.map.hl use.m.on { opacity: 1; }
.eq { display: inline-block; vertical-align: middle; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast button { color: var(--fit); margin-left: 12px; pointer-events: auto; }

/* ===== notes under the mock ===== */
.notes { max-width: 980px; margin: 24px auto 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.notes section { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; }
.notes h3 { margin: 0 0 8px; font-size: 13px; }
.notes ul { margin: 0; padding-left: 16px; color: var(--soft); font-size: 13px; line-height: var(--lh-read); }
.notes li + li { margin-top: 6px; }

/* ===== motion ===== */
@keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes beginPulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--fit) 45%, transparent); } 60% { box-shadow: 0 0 0 14px color-mix(in oklab, var(--fit) 0%, transparent); } }
@keyframes tickPop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes nextGlow { 0%, 100% { box-shadow: 0 0 0 2px color-mix(in oklab, var(--fit) 55%, transparent); } 50% { box-shadow: 0 0 0 4px color-mix(in oklab, var(--fit) 22%, transparent); } }
@keyframes holdBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
@keyframes trophyPop { 0% { transform: scale(.4) rotate(-12deg); opacity: 0; } 70% { transform: scale(1.12) rotate(3deg); opacity: 1; } 100% { transform: none; } }
@keyframes go { 0% { transform: translateX(0); } 30% { transform: translateX(4px); } 100% { transform: translateX(0); } }
.setR.go { animation: go .4s ease-out; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ===== phone: the same screen, one column (container width, not viewport) ===== */
@container mock (max-width: 640px) {
  .body { padding: 12px 12px 24px; }
  .hero { grid-template-columns: auto 1fr; gap: 12px; padding: 12px; }
  .map .fig { height: 96px; }
  .ring { width: 64px; height: 64px; }
  .ring svg { width: 64px; height: 64px; }
  .ring .rin b { font-size: 19px; }
  .hstats { grid-column: 1 / -1; }
  .ring { grid-row: 1; grid-column: 2; justify-self: end; }
  .hnums { gap: 12px; }
  .hn b { font-size: 18px; }
  .leg { grid-column: 1 / -1; }
  .chead { grid-template-columns: auto 1fr auto; }
  .chead .cx { display: none; }
  .ctrls { gap: 6px; }
  .step button { width: 36px; height: 36px; }
  .step output { min-width: 40px; }
  .setR { gap: 6px; }
  .setR .x { width: 28px; }
  .rest { top: 68px; }
  .notes { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="artDefs"></defs></svg>

<div class="bar">
  <h1>Workout Mode — one mock</h1>
  <div class="seg" id="devSeg" data-v="0"><i class="thumb"></i><button class="on" data-dev="0">Computer</button><button data-dev="1">Phone</button></div>
  <div class="seg" id="themeSeg" data-v="0"><i class="thumb"></i><button class="on" data-theme="light">Day</button><button data-theme="dark">Night</button></div>
  <span class="hint">Tap ▶ Begin workout, then tap a set number. L sit: tap ▶ to start the hold.</span>
</div>

<div class="frame" id="frame">
  <div class="sheet">
    <div class="head">
      <button class="back" data-a="close">‹ Back</button>
      <div class="ttl"><span class="type">Gym</span><span class="status" id="status">Planning</span></div>
      <button class="x" data-a="close" aria-label="Close">×</button>
    </div>
    <div class="body" id="body"></div>
  </div>
</div>

  if (a === 'hold') {
    const i = +t.closest('.setR').dataset.i, s = e.sets[i];
    if (hold && hold.exId === e.id && hold.i === i) { s.secs = Math.max(1, hold.total - hold.remain); hold = null; markDone(e, i, true); toast(`Saved ${s.secs}s`); }   // ■ saves what she held
    else { hold = { exId: e.id, i, remain: s.secs ?? 30, total: s.secs ?? 30 }; refreshCard(e); }
    return;
  }
  if (a === 'inc' || a === 'dec') { const i = +t.closest('.setR').dataset.i; stepValue(e, e.sets[i], t.closest('.step').dataset.f, a === 'inc' ? 1 : -1); refreshCard(e); paintRing(); return; }
  if (a === 'addset') { const last = e.sets[e.sets.length - 1]; const c = { ...last }; delete c.done; delete c.doneAt; e.sets.push(c); li.outerHTML = cardHtml(e, 0); pop($$(`.card[data-id="${e.id}"] .setR[data-i]`).pop()); paintMap(); paintRing(); return; }
  if (a === 'rmset') { const i = +t.closest('.setR').dataset.i, row = t.closest('.setR'); const fin = () => { e.sets.splice(i, 1); li.outerHTML = cardHtml(e, 0); paintMap(); paintRing(); }; if (calm) fin(); else row.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(.95)' }], { duration: 150, fill: 'forwards' }).onfinish = fin; return; }
  if (a === 'rmex') { const idx = EX.indexOf(e); EX.splice(idx, 1); li.remove(); paintMap(); paintRing(); toast(`Removed “${e.name}”`, () => { EX.splice(idx, 0, e); render(); }); return; }
  if (a === 'mode') { const b = ev.target.closest('button'); if (!b) return; const v = +b.dataset.v; if (!!v === e.timed) return; t.dataset.v = v; $$('button', t).forEach(x => x.classList.toggle('on', +x.dataset.v === v)); e.timed = !!v; e.sets.forEach(s => { if (v && s.secs == null) { s.secs = 30; s.secsR = 30; } if (!v && s.reps == null) { s.reps = 8; s.repsR = 8; } }); setTimeout(() => { li.outerHTML = cardHtml(e, 0); paintRing(); }, calm ? 0 : 200); return; }
  if (a === 'sided') { e.sided = !e.sided; e.sets.forEach(s => { if (e.sided) { s.repsR = s.repsR ?? s.reps; s.secsR = s.secsR ?? s.secs; } }); t.classList.toggle('on', e.sided); setTimeout(() => { li.outerHTML = cardHtml(e, 0); paintRing(); }, calm ? 0 : 160); return; }
  if (a === 'restdec' || a === 'restinc') { const i = REST.indexOf(e.rest) + (a === 'restinc' ? 1 : -1); if (i < 0 || i >= REST.length) return; e.rest = REST[i]; roll($('.rv', li), restTxt(e.rest), a === 'restinc' ? 1 : -1); refreshCard(e); paintRing(); return; }
  if (a === 'demo') { e.demoOpen = true; li.outerHTML = cardHtml(e, 0); const inp = $(`.card[data-id="${e.id}"] [data-a="demoin"]`); setTimeout(() => { inp.focus(); inp.select(); }, 100); return; }
  if (a === 'demoopen') { toast(`Opens ${e.video}`); return; }
  if (a === 'democancel') { e.demoOpen = false; li.outerHTML = cardHtml(e, 0); return; }
  if (a === 'demosave' || a === 'demodel') { e.video = a === 'demodel' ? '' : $('[data-a="demoin"]', li).value.trim(); e.demoOpen = false; li.outerHTML = cardHtml(e, 0); toast(e.video ? 'Demo link saved — remembered for this exercise' : 'Demo link removed'); return; }
});
$('#body').addEventListener('keydown', ev => {
  if (ev.target.id === 'addIn' && ev.key === 'Enter') addNamed(ev.target.value);
  if (ev.target.dataset.a === 'demoin' && ev.key === 'Enter') $('[data-a="demosave"]', ev.target.closest('.card')).click();
  if (ev.target.classList.contains('addset') && ev.key === 'Enter') ev.target.click();
});
$('#body').addEventListener('input', ev => { if (ev.target.dataset.a === 'pnote') pain.note = ev.target.value; });
$$('[data-a="close"]').forEach(b => b.addEventListener('click', () => toast(live ? `Closes — Time and Duration fill in from the clock (${mss(elapsed())})` : 'Closes — the plan is saved as you go')));

/* ===== mock chrome ===== */
function setSeg(seg, i) { seg.dataset.v = i; $$('button', seg).forEach((b, k) => b.classList.toggle('on', k === i)); }
$('#devSeg').onclick = ev => { const b = ev.target.closest('[data-dev]'); if (!b) return; const i = +b.dataset.dev; setSeg($('#devSeg'), i); $('#frame').classList.toggle('phone', !!i); };
$('#themeSeg').onclick = ev => { const b = ev.target.closest('[data-theme]'); if (!b) return; setSeg($('#themeSeg'), b.dataset.theme === 'dark' ? 1 : 0); document.documentElement.dataset.theme = b.dataset.theme; };

const NOTES = [
  { h: 'What changed from today’s screen', li: ['<b>The body strip:</b> front and back figures light up the muscles today’s exercises work; as you tick sets in a live session the body brightens — you watch the workout land. Beside it a ring counts sets done, with exercises · time · kg moved. Tap a muscle word to dim everything else.', '<b>Each exercise is a card</b> with its muscle picture and equipment, the Reps | Timer, Left &amp; right, Rest and Demo controls on one row, the ribbon that draws sets and rests to length, and one line per set with a fill bar — the same look as the templates editor you approved.', '<b>Week dots</b> now show the day letter under each dot; today’s is ringed. Nothing else on the week changed.'] },
  { h: 'Live session (tap ▶ Begin workout)', li: ['The green bar breathes until you tap it; the clock in the header starts and the ring fills from 0.', '<b>A set’s number is its done button.</b> Tap it: the row fills green, the number becomes ✓, and the rest starts on its own — a countdown ring pinned to the top with <b>+30s</b> and <b>Skip</b>, telling you what’s next. When it ends: a buzz, and the next set gives a small nudge.', 'The next set always has a soft glow; the card you’re in gets a green outline; a finished card says Done ✓.', '<b>L sit:</b> tap ▶ to start the hold — it counts down to the number in the box and ticks the set at zero (tap it again to stop early and save what you held).', 'Last set done: the trophy appears with sets and time. Pain notes sit at the bottom of a live session, as now.'] },
  { h: 'Still exactly the app’s data', li: ['Same fields: sets with reps / kg / seconds, Left &amp; right, Timer, rest, demo link, pain areas — nothing new to store. The plan is saved as you go; Begin creates the logged session, like now.', 'Numbers are typed or stepped with − +; Right follows Left. “Last time” and “PR” come from your logged sessions (examples shown here).', '+ Add exercise with an Often row; × removes with Undo, no confirm.'] },
  { h: 'For you to decide', li: ['<b>Gym visuals outside the templates editor.</b> When you approved the editor I noted the shaded artwork was “this editor only”. This mock brings it to Workout Mode — your ask. Say yes and I’ll write that as the rule for all gym screens.', '<b>Rest banner wording</b> — “Next: Leg raises · set 2, 8 reps” is new text; keep it, or ring + time only?', '<b>Phone:</b> the body strip stacks (figures left, ring right, legend under). The remove-exercise × is hidden on a phone — swipe or the Fitness page removes there. OK, or keep the ×?'] },
];
$('#notes').innerHTML = NOTES.map(s => `<section><h3>${s.h}</h3><ul>${s.li.map(x => `<li>${x}</li>`).join('')}</ul></section>`).join('');

/* ===== boot + deep links for checking the mock: #phone · #dark · #live · #done ===== */
render();
const H = location.hash;
if (/dark/.test(H)) { document.documentElement.dataset.theme = 'dark'; setSeg($('#themeSeg'), 1); }
if (/phone/.test(H)) { $('#frame').classList.add('phone'); setSeg($('#devSeg'), 1); }
if (/live|done/.test(H)) {
  live = true; startedAt = Date.now() - (4 * 60 + 32) * 1000;
  if (/done/.test(H)) { EX.forEach(e => e.sets.forEach(s => { s.done = true; })); startedAt = Date.now() - (23 * 60 + 41) * 1000; pain.areas = { Knee: 'L' }; }
  else { EX[0].sets[0].done = true; EX[0].sets[1].done = true; }
  render();
  if (!/done/.test(H)) startRest(90);
}
</script>
</body>
